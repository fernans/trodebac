<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CreateJS export from trodebac</title>

<script src="http://code.createjs.com/easeljs-0.6.0.min.js"></script>
<script src="http://code.createjs.com/tweenjs-0.4.0.min.js"></script>
<script src="http://code.createjs.com/movieclip-0.6.0.min.js"></script>
<script src="http://code.createjs.com/preloadjs-0.3.0.min.js"></script>
<script src="http://code.createjs.com/soundjs-0.4.0.min.js"></script>
<script src="trodebac.js"></script>

<script>
var canvas, stage, exportRoot;

function init() {
	canvas = document.getElementById("canvas");
	images = images||{};

	var manifest = [
		{src:"images/bgconmasclet.jpg", id:"bgconmasclet"},
		{src:"images/bgexplotado.jpg", id:"bgexplotado"},
		{src:"images/bgvacio.jpg", id:"bgvacio"},
		{src:"images/btinfo.png", id:"btinfo"},
		{src:"images/btmusicoff.png", id:"btmusicoff"},
		{src:"images/btmusicon.png", id:"btmusicon"},
		{src:"images/fondo.jpg", id:"fondo"},
		{src:"images/tro.png", id:"tro"},
		{src:"sounds/clinc.mp3", id:"clinc"},
		{src:"sounds/elfallero.mp3", id:"elfallero"},
		{src:"sounds/elfallero2.mp3", id:"elfallero2"},
		{src:"sounds/boom1.mp3", id:"boom1"},
		{src:"sounds/boom2.mp3", id:"boom2"},
		{src:"sounds/boom3.mp3", id:"boom3"},
		{src:"sounds/boom4.mp3", id:"boom4"},
		{src:"sounds/boom5.mp3", id:"boom5"},
		{src:"sounds/boom6.mp3", id:"boom6"}
	];

	var loader = new createjs.LoadQueue(false);
	loader.installPlugin(createjs.Sound);
	loader.addEventListener("fileload", handleFileLoad);
	loader.addEventListener("complete", handleComplete);
	loader.loadManifest(manifest);
}

function handleFileLoad(evt) {
	if (evt.item.type == "image") { images[evt.item.id] = evt.result; }
}

function handleComplete() {
	exportRoot = new lib.trodebac();

	stage = new createjs.Stage(canvas);
	stage.addChild(exportRoot);
	stage.update();

	createjs.Ticker.setFPS(24);
	createjs.Ticker.addEventListener("tick", stage);
}

function playSound(id, loop) {
	createjs.Sound.play(id, createjs.Sound.INTERRUPT_EARLY, 0, 0, loop);
}
</script>
</head>

<body onload="init();" style="background-color:#D4D4D4">
	<canvas id="canvas" width="1024" height="1280" style="background-color:#ffffff"></canvas>
</body>
</html>
